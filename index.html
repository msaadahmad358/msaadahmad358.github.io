<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhammad Saad Ahmad</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --text: #1d232b;
    --muted: #5d6673;
    --line: #d8d6d0;
    --line-strong: #b9b6ae;
    --accent: #1f3a5f;
    --accent-text: #ffffff;
    --frame: #eceae5;
    --shadow: none;
    --shadow-hover: none;
    --content-max: 600px;   /* one shared width for tabs + panels */
    --frame-pad: 4px;       /* padding inside media frames */
    --frame-border: 1px;
    --frame-extra: calc((var(--frame-pad) + var(--frame-border)) * 2); /* total = 10px */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; margin: 0;
    padding: 40px 16px 56px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(56px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; text-align: center;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  h1 {
    margin: 0 0 20px; max-width: 100%;
    padding-left: .08em;               /* cancels trailing letter-spacing so text is truly centered */
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600; font-size: clamp(20px, 4.5vw, 32px); letter-spacing: .08em;
    overflow-wrap: anywhere; text-wrap: balance;
  }

  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: var(--content-max); }
  .box {
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px;
    color: var(--text); text-decoration: none; font-size: 15px; line-height: 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 2px;
    transition: border-color .15s, box-shadow .15s;
  }
  .box:hover { border-color: var(--accent); }
  .box svg { flex: none; width: 20px; height: 20px; fill: currentColor; }

  .tabs { display: flex; justify-content: center; gap: 0; margin-top: 40px; border-bottom: 1px solid var(--line); width: 100%; max-width: var(--content-max); }
  .tab {
    flex: 1 1 0; min-width: 0;
    font: inherit; font-size: 15px; color: var(--muted); background: transparent; border: 0;
    border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 4px; cursor: pointer;
    text-align: center; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }

  .view { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
  .view button { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; background: var(--surface); color: var(--muted); border: 1px solid var(--line); border-radius: 2px; cursor: pointer; line-height: 0; }
  .view button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  .view svg, .item svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .panel { margin-top: 20px; width: 100%; max-width: var(--content-max); padding: 0; }
  .panel[hidden] { display: none; }
  .panel ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; }
  .panel ul.list { grid-template-columns: minmax(0, 1fr); }
  .panel ul.grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 130px), 1fr)); }
  .panel li { min-width: 0; display: flex; }
  .panel li > * { flex: 1 1 auto; min-width: 0; }

  .item {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text);
    text-decoration: none; background: var(--surface); border: 1px solid var(--line);
    border-radius: 2px; text-align: left;
  }
  .item svg { color: var(--accent); }

  /* ----- project card ----- */
  .app-card { align-items: center; gap: 16px; padding: 14px; }

  /* Frame: content-box so the aspect ratio applies to the picture area itself.
     Outer width = var(--w) exactly (content width + padding + border). */
  .media {
    box-sizing: content-box;
    flex: 0 0 auto;
    width: calc(var(--w, 72px) - var(--frame-extra));
    aspect-ratio: var(--r, 9 / 16);
    align-self: center;
    background: var(--frame); border: var(--frame-border) solid var(--line); border-radius: 2px; padding: var(--frame-pad);
  }
  .media video, .media img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .info { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; flex: 1 1 0; }
  .info h3 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .notice { padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 14px; text-align: left; }
  .desc { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 2px; padding: 1px 8px; }
  .view-btn {
    align-self: flex-start; margin-top: 2px; background: var(--accent); color: var(--accent-text);
    border: 1px solid var(--accent); border-radius: 2px; padding: 7px 16px; font: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: opacity .15s;
  }
  .view-btn:hover { opacity: .88; }
  ul.grid .app-card { flex-direction: column; text-align: center; align-items: center; }
  ul.grid .media { width: calc(min(100%, 160px) - var(--frame-extra)); flex: 0 0 auto; }
  ul.grid .info { align-items: center; flex: 0 0 auto; width: 100%; }
  ul.grid .chips { display: none; }
  ul.grid .view-btn { align-self: center; }


  /* ----- resource card ----- */
  .res-card { align-items: center; gap: 14px; padding: 14px; }
  .res-icon { flex: none; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: var(--frame); border: 1px solid var(--line); border-radius: 2px; }
  .res-icon svg { width: 24px; height: 24px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .btns .view-btn { margin-top: 0; align-self: auto; text-decoration: none; display: inline-block; line-height: 1.5; }
  .view-btn.alt { background: transparent; color: var(--accent); }
  .res-card audio { width: 100%; max-width: 100%; height: 36px; }
  ul.grid .res-card { flex-direction: column; text-align: center; }
  ul.grid .res-card .info { align-items: center; flex: 0 0 auto; width: 100%; }
  ul.grid .res-card .chips { display: none; }
  ul.grid .res-card .btns { justify-content: center; }

  /* ----- modal ----- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,14,20,.6); display: flex; align-items: center; justify-content: center;
    padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 10;
  }
  .overlay[hidden] { display: none; }
  .modal {
    position: relative; background: var(--surface); color: var(--text); width: 100%; max-width: 640px;
    max-height: 92vh; max-height: 92dvh; overflow: auto; overscroll-behavior: contain;
    padding: clamp(16px, 5vw, 28px); text-align: left; border: 1px solid var(--line); border-radius: 2px;
  }
  .modal .close { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 2px; width: 32px; height: 32px; padding: 0; font-size: 20px; line-height: 1; cursor: pointer; }
  .modal .close:hover { color: var(--text); border-color: var(--line-strong); }
  .modal h2 { margin: 0 0 12px; padding-right: 40px; font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 22px; line-height: 32px; overflow-wrap: anywhere; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tags:empty { display: none; }
  .tags span { border: 1px solid var(--line); border-radius: 2px; padding: 1px 10px; font-size: 13px; color: var(--muted); }
  .avail { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  .avail a { margin-left: .28em; color: var(--accent); }  /* ≈ one space, so gaps around "|" are equal */

  /* Each cell is exactly one grid column wide: img (content-box) + 10px frame + 2×5px margin = 100% */
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min, 90px), 1fr)); gap: 0; margin: -5px; }
  .shots[data-full="1"] img { cursor: pointer; }
  .shots img {
    box-sizing: content-box; display: block;
    width: calc(100% - 20px); margin: 5px;
    aspect-ratio: var(--r, 9 / 16); object-fit: contain;
    background: var(--frame); padding: var(--frame-pad); border: var(--frame-border) solid var(--line); border-radius: 2px;
  }

  @media (max-width: 380px) {
    body { padding-top: 28px; }
    .box { padding: 8px 12px; }
    .app-card { gap: 12px; padding: 12px; }
  }
</style>

  <script>
  /* ---------- Tabs ---------- */
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', t === tab));
    panels.forEach(p => p.hidden = p.id !== tab.dataset.target);
  }));

  /* ---------- View toggle ---------- */
  const viewBtns = document.querySelectorAll('.view button');
  viewBtns.forEach(btn => btn.addEventListener('click', () => {
    viewBtns.forEach(b => b.setAttribute('aria-pressed', b === btn));
    document.querySelectorAll('.panel ul').forEach(ul => ul.className = btn.dataset.view);
  }));

  /* ---------- Helpers ---------- */
  const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
  const enc = p => p.split('/').map(encodeURIComponent).join('/');

  // Image detection: assets/<id>/images/1.<ext>, 2.<ext> ... (png, jpg, jpeg, webp), contiguous numbering
  const IMG_EXTS = ['png', 'jpg', 'jpeg', 'webp'];
  const probeImg = url => new Promise(res => {
    const img = new Image();
    img.onload = () => res(true);
    img.onerror = () => res(false);
    img.src = url;
  });
  async function findImage(base, i) {
    const hits = await Promise.all(IMG_EXTS.map(ext => probeImg(enc(base + i + '.' + ext))));
    const k = hits.indexOf(true);
    return k < 0 ? null : base + i + '.' + IMG_EXTS[k];
  }
  async function loadScreenshots(folder, max = 30, count = 0, ext = '') {
    const base = 'assets/' + folder + '/images/';
    if (count && ext) return Array.from({ length: count }, (_, k) => base + (k + 1) + '.' + ext); // no probing
    const found = [];
    for (let i = 1; i <= max; i++) {                 // stop at the first missing number
      const p = await findImage(base, i);
      if (!p) break;
      found.push(p);
    }
    return found;
  }

  /* ---------- Data: loaded from apps.json ---------- */
  const KINDS = {
    app:  { ratio: '993 / 1920', cardW: 'min(88px, 24vw)',   shotMin: '90px',  button: 'View app' },
    site: { ratio: '16 / 9',     cardW: 'min(128px, 32vw)',  shotMin: '200px', button: 'View website' }
  };

  const overlay = document.getElementById('overlay');

  /* ---------- Always-playing video ---------- */
  const videos = new Set();

  function keepPlaying(v) {
    videos.add(v);
    const play = () => { if (v.isConnected && v.paused && !v.ended) v.play().catch(() => {}); };
    v.addEventListener('pause', () => { if (!document.hidden) setTimeout(play, 100); }); // resume if something paused it
    v.addEventListener('stalled', play);
    v.addEventListener('suspend', play);
    v.addEventListener('canplay', play, { once: true });
    play();
  }
  const resumeAll = () => videos.forEach(v => { if (v.paused) v.play().catch(() => {}); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeAll(); });
  window.addEventListener('pageshow', resumeAll);
  window.addEventListener('focus', resumeAll);
  // Browsers that block autoplay (e.g. low-power mode) allow it after the first touch/click
  ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(ev =>
    document.addEventListener(ev, resumeAll, { once: true, passive: true }));

  function makeVideo(item) {
    const video = el('video', {
      loop: true, autoplay: true, muted: true, defaultMuted: true, playsInline: true,
      preload: 'none', disablePictureInPicture: true
    });
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('aria-hidden', 'true');
    video.tabIndex = -1;
    if (item.poster) video.poster = enc(item.poster);   // shows instantly while video loads
    const base = item.videoBase;                         // assets/<id>/video/video
    const attach = () => {
      [['mp4', 'video/mp4'], ['webm', 'video/webm']].forEach(([ext, type]) =>
        video.append(el('source', { src: enc(base + '.' + ext), type })));
      // If no video file loads, fall back to the first screenshot
      video.lastElementChild.addEventListener('error', () => {
        videos.delete(video);
        if (item.poster) video.replaceWith(el('img', { src: enc(item.poster), alt: '', decoding: 'async' }));
      }, { once: true });
      video.load();
      keepPlaying(video);
    };
    // Only download a video when its card is about to scroll into view
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting)) { io.disconnect(); attach(); }
      }, { rootMargin: '300px' });
      io.observe(video);
    } else attach();
    return video;
  }

  /* ---------- Render ---------- */
  function renderCard(listId, item, kind) {
    const k = KINDS[kind];
    const li = el('li');
    const card = el('div', { className: 'item app-card' });
    card.style.setProperty('--r', k.ratio);
    card.style.setProperty('--w', k.cardW);

    const media = el('div', { className: 'media' });
    item.video = makeVideo(item);
    media.append(item.video);

    const info = el('div', { className: 'info' });
    const title = el('h3', { textContent: item.name });
    const desc = item.description ? el('p', { className: 'desc', textContent: item.description }) : null;
    const chips = el('div', { className: 'chips' });
    chips.append(...item.tags.map(t => el('span', { textContent: t })));
    const btn = el('button', { className: 'view-btn', type: 'button', textContent: k.button });
    btn.addEventListener('click', () => openItem(item, k));
    info.append(...[title, desc, chips, btn].filter(Boolean));

    card.append(media, info);
    li.append(card);
    document.getElementById(listId).append(li);
  }

  // Render each card immediately using the known first screenshot; load the rest lazily
  async function loadApps() {
    let apps = [];
    try {
      let data = window.APPS;                       // from apps.js (works when opened as a file)
      if (!data) {                                  // otherwise try apps.json (needs a server)
        const res = await fetch('apps.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        data = await res.json();
      }
      apps = Array.isArray(data) ? data : (data.apps || [data]);
    } catch (e) {
      console.error('Could not load apps data', e);
      document.getElementById('app-list').append(el('li', { className: 'notice',
        textContent: 'Could not load apps data. Make sure apps.js is next to index.html.' }));
      return;
    }
    for (const a of apps) {
      const folder = String(a.id);                 // media lives in assets/<id>/
      const base = 'assets/' + folder;
      const links = [['GitHub', a.github], ['Play Store', a.playStore], ['App Store', a.appStore]]
        .filter(([, url]) => url);
      const item = {
        folder, name: a.name, description: a.description,
        tags: a.tags || [], links,
        videoBase: base + '/video/video',
        poster: '', imageCount: a.imageCount || 0, imageExt: a.imageExt || '',
        screenshots: null
      };
      renderCard('app-list', item, 'app');           // no await: every card shows at once
      const setPoster = p => { item.poster = p || ''; if (p && item.video) item.video.poster = enc(p); };
      if (a.imageExt) setPoster(base + '/images/1.' + a.imageExt);
      else findImage(base + '/images/', 1).then(setPoster);
    }
  }
  loadApps();

  // Re-kick videos when switching tabs / layouts (hidden panels can pause media)
  document.querySelectorAll('.tab, .view button').forEach(b => b.addEventListener('click', () => setTimeout(resumeAll, 50)));


  /* ---------- Resources ---------- */
  const RES_FOLDERS = { json: 'json', audio: 'audio', image: 'images', pdf: 'pdfs' };  // kind -> assets/resources/<folder>
  const RES_ICONS = {
    json:  '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/>',
    pdf:   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',
    audio: '<path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 16l5-5 5 5 3-3 5 5M9 8h.01"/>'
  };
  const svgIcon = kind => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = RES_ICONS[kind] || RES_ICONS.json; return s; };


  /* ---------- Image-set resources (kind: "gallery") ---------- */
  const pad = (n, d) => String(n).padStart(d, '0');
  const getSize = url => new Promise(res => {
    const i = new Image();
    i.onload = () => res([i.naturalWidth, i.naturalHeight]);
    i.onerror = () => res(null);
    i.src = url;
  });
  // Finds the last existing number in a contiguous sequence with ~2*log2(n) requests (604 pages -> ~20 probes)
  async function countSeq(urlFor, cap = 5000) {
    if (!(await probeImg(urlFor(1)))) return 0;
    let lo = 1, hi = 2;
    while (hi <= cap && await probeImg(urlFor(hi))) { lo = hi; hi *= 2; }
    hi = Math.min(hi, cap + 1);
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (await probeImg(urlFor(mid))) lo = mid; else hi = mid;
    }
    return lo;
  }

  function renderGallery(r) {
    const digits = r.digits || 3, ext = r.ext || 'png', prefix = r.prefix ?? 'page';
    const dir = 'assets/resources/images/' + r.folder + '/';
    const pageUrl = i => dir + prefix + pad(i, digits) + '.' + ext;
    let count = r.pages || 0;

    const li = el('li');
    const card = el('div', { className: 'item res-card' });
    const icon = el('div', { className: 'res-icon' }); icon.append(svgIcon('image'));
    const info = el('div', { className: 'info' });
    const desc = r.description ? el('p', { className: 'desc', textContent: r.description }) : null;
    const size = r.size ? el('p', { className: 'desc', textContent: r.size }) : null;
    const chips = el('div', { className: 'chips' });
    chips.append(...(r.tags || []).map(t => el('span', { textContent: t })));
    const btns = el('div', { className: 'btns' });
    const btn = el('button', { className: 'view-btn', type: 'button', textContent: 'View pages' });
    const ensureCount = async () => count || (count = await countSeq(i => enc(pageUrl(i))));
    const saveBlob = (blob, name) => {
      const a = el('a', { href: URL.createObjectURL(blob), download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    };
    const zipBtn = el('button', { className: 'view-btn alt', type: 'button', textContent: 'Download ZIP' });
    zipBtn.addEventListener('click', async () => {
      zipBtn.disabled = true; zipBtn.textContent = 'Preparing…';
      try {
        if (!(await ensureCount())) throw new Error('no pages');
        if (r.zip) {                                   // ready-made zip supplied in the manifest
          const a = el('a', { href: enc(dir + r.zip), download: r.zip });
          document.body.append(a); a.click(); a.remove();
        } else {
          if (!window.JSZip) await new Promise((ok, fail) => document.head.append(el('script', {
            src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', onload: ok, onerror: fail })));
          const zip = new JSZip(), folder = zip.folder(r.folder);
          let next = 1, done = 0;
          const worker = async () => {
            while (next <= count) {
              const i = next++;
              const res = await fetch(enc(pageUrl(i)));
              if (!res.ok) throw new Error('HTTP ' + res.status);
              folder.file(prefix + pad(i, digits) + '.' + ext, await res.blob());
              zipBtn.textContent = 'Zipping ' + (++done) + '/' + count;
            }
          };
          await Promise.all(Array.from({ length: 6 }, worker));   // 6 downloads at a time
          zipBtn.textContent = 'Building ZIP…';
          saveBlob(await zip.generateAsync({ type: 'blob', compression: 'STORE' }), r.folder + '.zip');
        }
        zipBtn.textContent = 'Download ZIP';
      } catch (e) {
        console.error(e); zipBtn.textContent = 'Failed – retry';
      }
      zipBtn.disabled = false;
    });
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = 'Loading…';
      await ensureCount();
      if (!count) { btn.textContent = 'Not found'; btn.disabled = false; return; }
      const sz = await getSize(enc(pageUrl(1)));
      openItem({
        name: r.title + ' (' + count + ' pages)', tags: r.tags || [], links: [], full: true,
        screenshots: Array.from({ length: count }, (_, i) => pageUrl(i + 1))
      }, { ratio: sz ? sz[0] + ' / ' + sz[1] : '3 / 4', shotMin: '110px' });
      btn.disabled = false; btn.textContent = 'View pages';
    });
    btns.append(btn, zipBtn);
    info.append(...[el('h3', { textContent: r.title }), desc, size, chips, btns].filter(Boolean));
    card.append(icon, info); li.append(card);
    document.getElementById('res-list').append(li);
  }

  function renderResource(r) {
    if (r.kind === 'gallery') return renderGallery(r);
    const folder = RES_FOLDERS[r.kind] || r.kind;
    const file = r.file || (r.id + '.' + (r.kind === 'image' ? 'webp' : r.kind === 'audio' ? 'mp3' : r.kind));
    const url = enc('assets/resources/' + folder + '/' + file);

    const li = el('li');
    const card = el('div', { className: 'item res-card' });
    const icon = el('div', { className: 'res-icon' }); icon.append(svgIcon(r.kind));

    const info = el('div', { className: 'info' });
    const desc = r.description ? el('p', { className: 'desc', textContent: r.description }) : null;
    const size = r.size ? el('p', { className: 'desc', textContent: r.size }) : null;
    const chips = el('div', { className: 'chips' });
    chips.append(...(r.tags || []).map(t => el('span', { textContent: t })));

    const btns = el('div', { className: 'btns' });
    btns.append(el('a', { className: 'view-btn', href: url, download: file, textContent: 'Download' }));
    if (r.kind !== 'audio') btns.append(el('a', { className: 'view-btn alt', href: url, target: '_blank', rel: 'noopener', textContent: 'Open' }));

    const player = r.kind === 'audio' ? el('audio', { controls: true, preload: 'none', src: url }) : null;
    info.append(...[el('h3', { textContent: r.title }), desc, size, chips, player, btns].filter(Boolean));
    card.append(icon, info); li.append(card);
    document.getElementById('res-list').append(li);
  }
  (window.RESOURCES || []).forEach(renderResource);

  /* ---------- Modal ---------- */
  async function openItem(item, k) {
    document.getElementById('m-title').textContent = item.name;
    document.getElementById('m-tags').replaceChildren(
      ...item.tags.map(t => el('span', { textContent: t }))
    );

    const avail = document.getElementById('m-avail');
    avail.hidden = !item.links.length;
    avail.replaceChildren(document.createTextNode('Available on:'));
    item.links.forEach(([label, url], i) => {
      if (i > 0) avail.append(document.createTextNode(' |'));
      avail.append(el('a', { href: url, textContent: label, target: '_blank', rel: 'noopener' }));
    });

    const shots = document.getElementById('m-shots');
    shots.dataset.full = item.full ? '1' : '';
    shots.style.setProperty('--r', k.ratio);
    shots.style.setProperty('--min', k.shotMin);
    overlay.hidden = false;

    if (!item.screenshots) item.screenshots = await loadScreenshots(item.folder, 30, item.imageCount, item.imageExt);
    shots.replaceChildren(...item.screenshots.map((src, i) =>
      el('img', { src: enc(src), alt: item.name + ' screenshot ' + (i + 1), loading: 'lazy', decoding: 'async' })
    ));
  }

  document.getElementById('m-shots').addEventListener('click', e => {
    if (e.target.tagName === 'IMG' && e.currentTarget.dataset.full) window.open(e.target.src, '_blank', 'noopener');
  });
  const closeApp = () => { overlay.hidden = true; resumeAll(); };
  document.getElementById('m-close').addEventListener('click', closeApp);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeApp(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });
</script>
</body>
</html>
