  <style>
  :root {
    --bg: #FFFFFF; 
    --surface: #F5F5F7; 
    --text: #1d232b;
    --muted: #5d6673;
    --line: #d8d6d0;
    --line-strong: #b9b6ae;
    --accent: #1f3a5f;
    --accent-text: #ffffff;
    --frame: #eceae5;
    --content-max: 800px;
    --frame-pad: 4px;       
    --frame-border: 1px;
    --frame-extra: calc((var(--frame-pad) + var(--frame-border)) * 2); 
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }
  body {

    padding-left: .08em;               
    font-family: Georgia, "Times New Roman", serif;

    overflow-wrap: anywhere; text-wrap: balance;

  /* ===================== NAV + HERO ===================== */
  :root {

    --h-grey: #F5F5F7;

  .site-nav, .hero {

    margin-inline: calc(50% - 50vw);
    font-family: var(--h-font);
    color: var(--h-black);
    text-align: center;
  }

  /* Navigation */
  .site-nav { position: relative; z-index: 20; background: var(--h-white); height: var(--h-nav-h); }
  .nav-inner {
    height: 100%; max-width: 1280px; margin: 0 auto;
    padding-inline: max(24px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-right));
    display: flex; align-items: center; justify-content: center; gap: 40px;
  }
  .nav-logo { display: flex; align-items: center; flex: none; }
  .nav-logo img { height: 28px; width: auto; display: block; }
  .nav-links { display: flex; align-items: center; gap: 32px; margin: 0; padding: 0; list-style: none; }
  .nav-links a {
    display: block; padding: 8px 0;
    font-size: 15px; font-weight: 400; line-height: 24px;
    color: var(--h-black); text-decoration: none; transition: color .15s;
  }
  .nav-links a:hover { color: var(--h-blue); }
  .nav-toggle {
    display: none; align-items: center; justify-content: center;
    width: 44px; height: 44px; margin-right: -10px; padding: 0;
    background: transparent; border: 0; cursor: pointer; color: var(--h-black);
  }
  .nav-toggle svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; fill: none; }

  /* Hero */
  .hero { background: var(--h-grey); overflow: hidden; }
  .hero-inner {
    max-width: 1280px; margin: 0 auto;
    padding-inline: max(24px, env(safe-area-inset-left)) max(24px, env(safe-area-inset-right));
    /* Adjusted padding to tighten the container */
    padding-block: 24px 0;
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    align-items: stretch; /* This allows the image to stick to the bottom */
  }
  
  .hero-copy { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    padding: 0 24px 48px 24px; 
  }
  
  .hero .hero-title {
    margin: 0; padding: 0; max-width: none;
    font-family: var(--h-font); font-weight: 700;
    font-size: clamp(40px, 6vw, 76px); line-height: 1.05; letter-spacing: -0.03em;
    color: var(--h-black); text-wrap: balance;
  }
  
  .hero-sub {
    margin: 16px 0 0; 
    font-size: clamp(18px, 1.7vw, 24px); font-weight: 400; line-height: 1.4; letter-spacing: -0.01em;
    color: var(--h-black);
  }
  
  .hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 32px; }
  
  .hero-btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 48px; padding: 0 28px; border-radius: 999px;
    font-family: var(--h-font); font-size: 17px; font-weight: 500; line-height: 1; letter-spacing: -0.01em;
    text-decoration: none; white-space: nowrap; cursor: pointer;
    border: 1.5px solid var(--h-blue);
    transition: background-color .15s, color .15s, opacity .15s;
  }
  .hero-btn.primary { background: var(--h-blue); color: var(--h-white); }
  .hero-btn.primary:hover { opacity: .88; }
  .hero-btn.outline { background: transparent; color: var(--h-blue); }
  .hero-btn.outline:hover { background: var(--h-blue); color: var(--h-white); }
  .hero-btn:focus-visible, .nav-links a:focus-visible, .nav-toggle:focus-visible, .nav-logo:focus-visible {
    outline: 2px solid var(--h-blue); outline-offset: 3px;
  }
  
  /* Hero Image - Sticked to bottom */
  .hero-media { 
    display: flex; 
    align-items: flex-end; 
    justify-content: center; 
    min-width: 0; 
    /* Removed self-alignment so it stretches with the grid */
  }
  
  .hero-media img {
    display: block; 
    width: auto; 
    max-width: 100%;
    max-height: 500px; 
    object-fit: contain;
    /* Negative margin pulls it 15px down to bleed off the bottom edge */
    margin-bottom: -15px; 
  }

  @media (max-width: 768px) {
    .nav-inner { justify-content: space-between; gap: 0; }
    .nav-toggle { display: flex; }
    .nav-links {
      position: absolute; top: var(--h-nav-h); left: 0; right: 0;
      flex-direction: column; align-items: stretch; gap: 0;
      padding: 8px 24px 16px; background: var(--h-white);
      border-top: 1px solid rgba(0,0,0,.08); box-shadow: 0 12px 24px rgba(0,0,0,.06);
      text-align: left; display: none;
    }
    .site-nav.open .nav-links { display: flex; }
    .nav-links a { padding: 14px 0; font-size: 17px; border-bottom: 1px solid rgba(0,0,0,.06); }
    .nav-links li:last-child a { border-bottom: 0; }

    .hero-inner { 
      grid-template-columns: 1fr; 
      gap: 32px; 
      padding-block: 32px 0; /* Keep 0 bottom padding for mobile too */
    }
    .hero-copy { padding: 0 24px; }
    .hero-sub { margin-top: 12px; }
    .hero-actions { flex-direction: column; align-items: center; gap: 12px; margin-top: 24px; width: 100%; }
    .hero-btn { width: min(100%, 220px); }
    .hero-media {

      padding: 0 24px;
    }

      margin-bottom: -10px; /* Slight bleed on mobile */
    }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .hero-btn, .nav-links a { transition: none; } }
  /* ===================== /NAV + HERO ===================== */

  /* ----- Wrapper for rest of content ----- */
  .main-content {
    width: 100%;
    max-width: 100%;
    padding: 0 16px 56px;
    display: flex; flex-direction: column; align-items: center;
  }

  /* ----- TABS & VIEW SECTION ----- */
  .tabs-header {
    width: 100%;
    max-width: var(--content-max);
    margin: 48px auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    scroll-margin-top: 80px;
  }

  .tabs { display: flex; align-items: center; gap: 8px; }
  
  .tab {
    font-family: var(--h-font); font-size: 18px; font-weight: 500;
    color: var(--h-black); background: transparent; border: none;
    padding: 8px 20px; border-radius: 999px; cursor: pointer;
    white-space: nowrap; transition: background-color 0.2s, color 0.2s;
  }
  .tab:hover { color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--h-black); color: var(--h-white); }

  .view { display: flex; gap: 16px; }
  .view button { 
    display: flex; align-items: center; justify-content: center; 
    background: transparent; color: var(--h-black); border: none; 
    cursor: pointer; padding: 4px; opacity: 0.4; transition: opacity 0.2s;
  }
  .view button:hover { opacity: 0.7; }
  .view button[aria-pressed="true"] { opacity: 1; }
  .view svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  @media (max-width: 768px) {
    .tabs-header { flex-direction: column; gap: 16px; margin: 32px auto 16px; }
    .tabs { width: 100%; justify-content: space-between; }
    .tab { font-size: 16px; padding: 8px 12px; }
    .view { align-self: flex-end; }
  }

  /* ----- PANELS ----- */
  .panel { margin-top: 20px; width: 100%; max-width: var(--content-max); padding: 0; }
  .panel[hidden] { display: none; }
  .panel ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 20px; }
  .panel ul.list { grid-template-columns: minmax(0, 1fr); }
  .panel ul.grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
  .panel li { min-width: 0; display: flex; }
  .panel li > * { flex: 1 1 auto; min-width: 0; }

  /* ----- Project Cards ----- */
  .item {
    display: flex; align-items: center; gap: 20px; padding: 20px; color: var(--text);
    text-decoration: none; background: var(--surface);
    border: 1px solid transparent; border-radius: 16px; text-align: left;
  }
  
  .app-card { position: relative; }

  .media {
    box-sizing: content-box; flex: 0 0 auto;
    width: calc(var(--w, 120px) - var(--frame-extra));
    aspect-ratio: var(--r, 9 / 16); align-self: center;
    background: transparent; border: none; border-radius: 0; padding: 0;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .media video, .media img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .media.fallback { background: #eef1f5; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 14px; letter-spacing: 0.05em; border-radius: 8px;}
  
  .info { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; flex: 1 1 0; }
  .info h3 { margin: 0; font-family: var(--h-font); font-size: 20px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; color: var(--h-black); }
  .desc { margin: 0; font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  
  .card-bottom { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; }
  
  .view-btn {
    background: var(--h-blue); color: var(--h-white);
    border: none; border-radius: 20px; padding: 8px 18px; font: inherit; font-size: 14px;
    font-weight: 600; cursor: pointer; transition: opacity .15s; white-space: nowrap;
  }
  .view-btn:hover { opacity: .88; }
  
  .availability { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  .availability a { color: var(--h-blue); text-decoration: none; }
  .availability a:hover { text-decoration: underline; }

  /* Grid View Overrides */
  ul.grid .app-card { flex-direction: column; text-align: center; align-items: center; padding: 24px 20px; }
  ul.grid .media { width: 100%; max-width: 220px; margin-bottom: 12px; }
  ul.grid .info { align-items: center; flex: 0 0 auto; width: 100%; gap: 16px; }
  ul.grid .card-bottom { justify-content: center; flex-direction: column; gap: 12px; width: 100%; }
  ul.grid .chips { display: none; }
  ul.grid .view-btn { align-self: center; padding: 10px 24px; font-size: 15px; }

  /* ----- Resource Card ----- */
  .res-card { align-items: center; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .res-icon { flex: none; display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: var(--frame); border: 1px solid var(--line); border-radius: 8px; }
  .res-icon svg { width: 28px; height: 28px; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .btns .view-btn { margin-top: 0; align-self: auto; text-decoration: none; display: inline-block; line-height: 1.5; }
  .view-btn.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .res-card audio { width: 100%; max-width: 100%; height: 36px; }
  ul.grid .res-card { flex-direction: column; text-align: center; }
  ul.grid .res-card .info { align-items: center; flex: 0 0 auto; width: 100%; }
  ul.grid .res-card .chips { display: none; }
  ul.grid .res-card .btns { justify-content: center; }

  /* ----- FOOTER DESIGN ----- */
  .site-footer {
    width: 100vw;
    margin-inline: calc(50% - 50vw);
    background-color: #000000;
    color: #ffffff;
    padding: 64px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: var(--h-font);
    scroll-margin-top: 20px;

  .footer-profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 24px;
    background-color: #333;
  }

  .footer-name {
    font-size: 32px;
    font-weight: 700;
    margin: 0 0 8px;
    color: #ffffff;
  }

  .footer-subtitle {
    font-size: 16px;
    color: #cccccc;
    margin: 0 0 32px;
  }

  .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 16px;
    max-width: 800px;
  }

  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--h-blue);
    color: #ffffff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    transition: opacity 0.2s;
  }

  .footer-btn:hover { opacity: 0.85; }
  .footer-btn svg { width: 18px; height: 18px; fill: currentColor; }

  @media (max-width: 768px) {
    .footer-name { font-size: 26px; }
    .footer-subtitle { font-size: 14px; }
    .footer-btn { padding: 8px 16px; font-size: 13px; }
  }

  /* ----- MODAL (ALERT SECTION) ----- */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,14,20,.6); display: flex; align-items: center; justify-content: center;
    padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom));
    z-index: 30;
  }
  .overlay[hidden] { display: none; }
  
  .modal {
    position: relative; 
    background: #FFFFFF; 
    color: #000000; 
    width: 100%; 
    max-width: 900px;
    max-height: 92vh; 
    max-height: 92dvh; 
    overflow: auto; 
    overscroll-behavior: contain;
    padding: 40px 32px; 
    text-align: left; 
    border-radius: 4px;
    font-family: var(--h-font);
  }

  .modal .close { 
    position: absolute; 
    top: 16px; 
    right: 16px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    background: transparent; 
    color: #000000; 
    border: 1.5px solid #000000; 
    border-radius: 0;
    width: 32px; 
    height: 32px; 
    padding: 0; 
    font-size: 20px; 
    line-height: 1; 
    cursor: pointer; 
  }
  .modal .close:hover { background: #f0f0f0; }

  .modal h2 { 
    margin: 0 0 12px; 
    padding-right: 40px; 
    font-family: var(--h-font); 
    font-weight: 700; 
    font-size: 28px; 
    line-height: 1.2; 
    overflow-wrap: anywhere; 
    color: #000000;
  }
  
  /* Inline Availability */
  .modal .avail { 
    margin: 0 0 16px; 
    color: #000000; 
    font-size: 15px; 
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .modal .avail a { 
    color: #0071E3; 
    text-decoration: none; 
  }
  .modal .avail a:hover { text-decoration: underline; }

  /* Tags styled as light grey boxes */
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .tags:empty { display: none; }
  .tags span { 
    border: 1px solid #d1d1d1; 
    background: #FAFAFA;
    border-radius: 4px; 
    padding: 4px 12px; 
    font-size: 13px; 
    color: #333333; 
  }

  /* Screenshot Grid */
  .shots { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
    gap: 16px; 
    margin-top: 24px;
  }
  .shots[data-full="1"] img { cursor: pointer; }
  .shots img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
  }

  @media (max-width: 600px) {
    .modal { padding: 24px 20px; }
    .modal h2 { font-size: 22px; }
    .shots { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
  }

  @media (max-width: 380px) {
    .item { padding: 12px; gap: 12px; }
    .info h3 { font-size: 18px; }
    .tab { font-size: 15px; padding: 6px 10px; }
  }
</style>
</head>

  <script src="apps.js"></script>

  <script>
  /* ---------- Tabs ---------- */
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.setAttribute('aria-selected', t === tab));
    panels.forEach(p => p.hidden = p.id !== tab.dataset.target);
  }));

  /* ---------- View toggle ---------- */
  const viewBtns = document.querySelectorAll('.view button');
  viewBtns.forEach(btn => btn.addEventListener('click', () => {
    viewBtns.forEach(b => b.setAttribute('aria-pressed', b === btn));
    document.querySelectorAll('.panel ul').forEach(ul => ul.className = btn.dataset.view);
  }));

  /* ---------- Helpers ---------- */
  const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
  const enc = p => p.split('/').map(encodeURIComponent).join('/');

  const IMG_EXT = 'png';
  const probeImg = url => new Promise(res => {
    const img = new Image();
    img.onload = () => res(true);
    img.onerror = () => res(false);
    img.src = url;
  });
  const exists = async url => {
    try {
      const r = await fetch(url, { method: 'HEAD' });
      return r.ok;
    } catch (e) {
      return probeImg(url);
    }
  };
  async function loadScreenshots(basePath, max = 30, count = 0) {
    if (!basePath) return [];
    const base = basePath + '/images/';
    if (count) return Array.from({ length: count }, (_, k) => base + (k + 1) + '.' + IMG_EXT);
    const found = [];
    for (let i = 1; i <= max; i++) {
      const p = base + i + '.' + IMG_EXT;
      if (!(await exists(enc(p)))) break;
      found.push(p);
    }
    return found;
  }

  /* ---------- Data ---------- */
  const KINDS = {
    app:  { ratio: '993 / 1920', cardW: 'min(130px, 32vw)',   shotMin: '90px',  button: 'View App' },
    site: { ratio: '16 / 9',     cardW: 'min(160px, 40vw)',  shotMin: '200px', button: 'View Website' }
  };

  const overlay = document.getElementById('overlay');

  /* ---------- Video/Media ---------- */
  const visibleVideos = new Set();
  const playVideo = v => { if (v.paused) v.play().catch(() => {}); };

  const videoIO = 'IntersectionObserver' in window
    ? new IntersectionObserver(entries => {
        for (const { target: v, isIntersecting } of entries) {
          if (isIntersecting) {
            if (!v.dataset.ready) {
              v.dataset.ready = '1';
              if (v._poster) v.poster = v._poster;
              v.src = v._src;
            }
            visibleVideos.add(v);
            playVideo(v);
          } else {
            visibleVideos.delete(v);
            v.pause();
          }
        }
      }, { rootMargin: '200px' })
    : null;

  const resumeVisible = () => visibleVideos.forEach(playVideo);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resumeVisible(); });
  ['pointerdown', 'touchstart', 'keydown', 'scroll'].forEach(ev =>
    document.addEventListener(ev, resumeVisible, { once: true, passive: true }));

  function makeMedia(item) {
    const video = el('video', {
      loop: true, muted: true, defaultMuted: true, playsInline: true,
      preload: 'none', disablePictureInPicture: true
    });
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('aria-hidden', 'true');
    video.tabIndex = -1;
    video._poster = item.poster ? enc(item.poster) : '';
    video._src = enc(item.videoBase + '.mp4');

    video.addEventListener('error', () => {
      visibleVideos.delete(video);
      if (videoIO) videoIO.unobserve(video);
      
      if (video._poster) {
        const img = el('img', { src: video._poster, alt: '', decoding: 'async' });
        img.addEventListener('error', () => {
            const fallback = el('div', { className: 'media fallback' });
            fallback.textContent = item.name.substring(0, 15);
            img.replaceWith(fallback);
        }, { once: true });
        video.replaceWith(img);
      } else {
        const fallback = el('div', { className: 'media fallback' });
        fallback.textContent = item.name.substring(0, 15);
        video.replaceWith(fallback);
      }
    }, { once: true });
    
    if (videoIO) videoIO.observe(video);
    else { video.poster = video._poster; video.src = video._src; video.autoplay = true; }
    return video;
  }

  /* ---------- Render ---------- */
  function renderCard(listFrag, item, kind) {
    const k = KINDS[kind];
    const li = el('li');
    const card = el('div', { className: 'item app-card' });
    card.style.setProperty('--r', k.ratio);
    card.style.setProperty('--w', k.cardW);

    const mediaWrapper = el('div', { className: 'media' });
    mediaWrapper.append(makeMedia(item));

    const info = el('div', { className: 'info' });
    const title = el('h3', { textContent: item.name });
    
    const cardBottom = el('div', { className: 'card-bottom' });
    const btn = el('button', { className: 'view-btn', type: 'button', textContent: k.button });
    
    const webLink = item.links.find(l => l[0] === 'Website');
    if (kind === 'site' && webLink && webLink[1]) {
        btn.addEventListener('click', () => window.open(webLink[1], '_blank', 'noopener'));
    } else {
        btn.addEventListener('click', () => openItem(item, k));
    }

    let availText = null;
    if (item.links && item.links.length > 0) {
      availText = el('div', { className: 'availability' });
      availText.append(document.createTextNode('Available on: '));
      item.links.forEach(([label, url], i) => {
        if (i > 0) availText.append(document.createTextNode(', '));
        availText.append(el('a', { href: url, textContent: label, target: '_blank', rel: 'noopener' }));
      });
    }

    cardBottom.append(btn);
    if (availText) cardBottom.append(availText);

    const chips = el('div', { className: 'chips' });
    chips.append(...(item.tags || []).map(t => el('span', { textContent: t })));

    info.append(title, chips, cardBottom);
    card.append(mediaWrapper, info);
    li.append(card);
    listFrag.append(li);
  }

  function loadApps() {
    const listApps = document.getElementById('app-list');
    const listSites = document.getElementById('site-list');
    
    const fragApps = document.createDocumentFragment();
    const fragSites = document.createDocumentFragment();

    if (window.APPS) {
        window.APPS.forEach(a => {
            const basePath = 'assets/apps/' + String(a.id);
            const links = [
                ['GitHub', a.github], 
                ['Play Store', a.playStore], 
                ['App Store', a.appStore]
            ].filter(([, val]) => val);

            renderCard(fragApps, {
              folder: String(a.id),
              basePath: basePath, 
              name: a.name, 
              description: a.description,
              tags: a.tags || [], 
              links,
              videoBase: basePath + '/video/video', 
              poster: basePath + '/images/1.' + IMG_EXT, 
              imageCount: a.imageCount || 0,
              screenshots: null
            }, 'app');
        });
    }

    if (window.WEBSITES) {
        window.WEBSITES.forEach(a => {
            const basePath = 'assets/websites/' + String(a.id);
            const url = a["website-url"] || a.url;
            const links = [
                ['GitHub', a.github], 
                ['Website', url]
            ].filter(([, val]) => val);

            renderCard(fragSites, {
              folder: String(a.id),
              basePath: basePath, 
              name: a.name, 
              description: a.description,
              tags: a.tags || [], 
              links,
              videoBase: basePath + '/video/video', 
              poster: basePath + '/images/1.' + IMG_EXT, 
              imageCount: a.imageCount || 0,
              screenshots: null
            }, 'site');
        });
    }
    
    if (fragApps.childNodes.length > 0) listApps.append(fragApps);
    else listApps.innerHTML = '<li class="notice" style="border:none;justify-content:center;color:var(--muted);">No mobile apps added yet.</li>';

    if (fragSites.childNodes.length > 0) listSites.append(fragSites);
    else listSites.innerHTML = '<li class="notice" style="border:none;justify-content:center;color:var(--muted);">No websites added yet.</li>';
  }
  
  loadApps();


  /* ---------- Resources ---------- */
  const RES_FOLDERS = { json: 'json', audio: 'audio', image: 'images', pdf: 'pdfs' };
  const RES_ICONS = {
    json:  '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h8"/>',
    pdf:   '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>',
    audio: '<path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>',
    image: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 16l5-5 5 5 3-3 5 5M9 8h.01"/>'
  };
  const svgIcon = kind => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 24 24'); s.innerHTML = RES_ICONS[kind] || RES_ICONS.json; return s; };


  /* ---------- Image-set resources ---------- */
  const pad = (n, d) => String(n).padStart(d, '0');
  const getSize = url => new Promise(res => {
    const i = new Image();
    i.onload = () => res([i.naturalWidth, i.naturalHeight]);
    i.onerror = () => res(null);
    i.src = url;
  });
  async function countSeq(urlFor, cap = 5000) {
    if (!(await exists(urlFor(1)))) return 0;
    let lo = 1, hi = 2;
    while (hi <= cap && await exists(urlFor(hi))) { lo = hi; hi *= 2; }
    hi = Math.min(hi, cap + 1);
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      if (await exists(urlFor(mid))) lo = mid; else hi = mid;
    }
    return lo;
  }

  function renderGallery(r, frag) {
    const digits = r.digits || 3, ext = r.ext || 'png', prefix = r.prefix ?? 'page';
    const dir = 'assets/resources/images/' + r.folder + '/';
    const pageUrl = i => dir + prefix + pad(i, digits) + '.' + ext;
    let count = r.pages || 0;

    const li = el('li');
    const card = el('div', { className: 'item res-card' });
    const icon = el('div', { className: 'res-icon' }); icon.append(svgIcon('image'));
    const info = el('div', { className: 'info' });
    const desc = r.description ? el('p', { className: 'desc', textContent: r.description }) : null;
    const size = r.size ? el('p', { className: 'desc', textContent: r.size }) : null;
    const chips = el('div', { className: 'chips' });
    chips.append(...(r.tags || []).map(t => el('span', { textContent: t })));
    const btns = el('div', { className: 'btns' });
    const btn = el('button', { className: 'view-btn', type: 'button', textContent: 'View pages' });
    const ensureCount = async () => count || (count = await countSeq(i => enc(pageUrl(i))));
    const saveBlob = (blob, name) => {
      const a = el('a', { href: URL.createObjectURL(blob), download: name });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    };
    const zipBtn = el('button', { className: 'view-btn alt', type: 'button', textContent: 'Download ZIP' });
    zipBtn.addEventListener('click', async () => {
      zipBtn.disabled = true; zipBtn.textContent = 'Preparing…';
      try {
        if (!(await ensureCount())) throw new Error('no pages');
        if (r.zip) {
          const a = el('a', { href: enc(dir + r.zip), download: r.zip });
          document.body.append(a); a.click(); a.remove();
        } else {
          if (!window.JSZip) await new Promise((ok, fail) => document.head.append(el('script', {
            src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', onload: ok, onerror: fail })));
          const zip = new JSZip(), folder = zip.folder(r.folder);
          let next = 1, done = 0;
          const worker = async () => {
            while (next <= count) {
              const i = next++;
              const res = await fetch(enc(pageUrl(i)));
              if (!res.ok) throw new Error('HTTP ' + res.status);
              folder.file(prefix + pad(i, digits) + '.' + ext, await res.blob());
              zipBtn.textContent = 'Zipping ' + (++done) + '/' + count;
            }
          };
          await Promise.all(Array.from({ length: 6 }, worker));
          zipBtn.textContent = 'Building ZIP…';
          saveBlob(await zip.generateAsync({ type: 'blob', compression: 'STORE' }), r.folder + '.zip');
        }
        zipBtn.textContent = 'Download ZIP';
      } catch (e) {
        console.error(e); zipBtn.textContent = 'Failed – retry';
      }
      zipBtn.disabled = false;
    });
    btn.addEventListener('click', async () => {
      btn.disabled = true; btn.textContent = 'Loading…';
      await ensureCount();
      if (!count) { btn.textContent = 'Not found'; btn.disabled = false; return; }
      const sz = await getSize(enc(pageUrl(1)));
      openItem({
        name: r.title + ' (' + count + ' pages)', tags: r.tags || [], links: [], full: true,
        screenshots: Array.from({ length: count }, (_, i) => pageUrl(i + 1))
      }, { ratio: sz ? sz[0] + ' / ' + sz[1] : '3 / 4', shotMin: '110px' });
      btn.disabled = false; btn.textContent = 'View pages';
    });
    btns.append(btn, zipBtn);
    info.append(...[el('h3', { textContent: r.title }), desc, size, chips, btns].filter(Boolean));
    card.append(icon, info); li.append(card);
    frag.append(li);
  }

  function renderResource(r, frag) {
    if (r.kind === 'gallery') return renderGallery(r, frag);
    const folder = RES_FOLDERS[r.kind] || r.kind;
    const file = r.file || (r.id + '.' + (r.kind === 'image' ? 'webp' : r.kind === 'audio' ? 'mp3' : r.kind));
    const url = enc('assets/resources/' + folder + '/' + file);

    const li = el('li');
    const card = el('div', { className: 'item res-card' });
    const icon = el('div', { className: 'res-icon' }); icon.append(svgIcon(r.kind));

    const info = el('div', { className: 'info' });
    const desc = r.description ? el('p', { className: 'desc', textContent: r.description }) : null;
    const size = r.size ? el('p', { className: 'desc', textContent: r.size }) : null;
    const chips = el('div', { className: 'chips' });
    chips.append(...(r.tags || []).map(t => el('span', { textContent: t })));

    const btns = el('div', { className: 'btns' });
    btns.append(el('a', { className: 'view-btn', href: url, download: file, textContent: 'Download' }));
    if (r.kind !== 'audio') btns.append(el('a', { className: 'view-btn alt', href: url, target: '_blank', rel: 'noopener', textContent: 'Open' }));

    const player = r.kind === 'audio' ? el('audio', { controls: true, preload: 'none', src: url }) : null;
    info.append(...[el('h3', { textContent: r.title }), desc, size, chips, player, btns].filter(Boolean));
    card.append(icon, info); li.append(card);
    frag.append(li);
  }
  {
    const frag = document.createDocumentFragment();
    (window.RESOURCES || []).forEach(r => renderResource(r, frag));
    document.getElementById('res-list').append(frag);
  }

  /* ---------- Modal ---------- */
  async function openItem(item, k) {
    document.getElementById('m-title').textContent = item.name;
    
    // Tags
    document.getElementById('m-tags').replaceChildren(
      ...item.tags.map(t => el('span', { textContent: t }))
    );

    // Availability
    const avail = document.getElementById('m-avail');
    avail.hidden = !item.links.length;
    avail.replaceChildren(document.createTextNode('Available on: '));
    item.links.forEach(([label, url], i) => {
      if (i > 0) avail.append(document.createTextNode(', '));
      avail.append(el('a', { href: url, textContent: label, target: '_blank', rel: 'noopener' }));
    });

    // Screenshots
    const shots = document.getElementById('m-shots');
    shots.dataset.full = item.full ? '1' : '';
    shots.style.setProperty('--r', k.ratio);
    shots.style.setProperty('--min', k.shotMin);
    shots.replaceChildren(); 
    overlay.hidden = false;

    if (!item.screenshots && item.basePath) {
      item.screenshots = await loadScreenshots(item.basePath, 30, item.imageCount);
    }
    
    if (item.screenshots.length === 0) {
        shots.innerHTML = '<p style="color:var(--muted); padding: 10px;">No screenshots available.</p>';
    } else {
        shots.replaceChildren(...item.screenshots.map((src, i) =>
          el('img', { src: enc(src), alt: item.name + ' screenshot ' + (i + 1), loading: 'lazy', decoding: 'async' })
        ));
    }
  }

  document.getElementById('m-shots').addEventListener('click', e => {
    if (e.target.tagName === 'IMG' && e.currentTarget.dataset.full) window.open(e.target.src, '_blank', 'noopener');
  });
  const closeApp = () => { overlay.hidden = true; };
  document.getElementById('m-close').addEventListener('click', closeApp);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeApp(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeApp(); });
</script>

  <!-- ---------- Nav behaviour ---------- -->
  <script>
  (function () {
    const nav = document.querySelector('.site-nav');
    const toggle = nav.querySelector('.nav-toggle');
    const setOpen = open => {
      nav.classList.toggle('open', open);
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    };
    toggle.addEventListener('click', () => setOpen(!nav.classList.contains('open')));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });

    nav.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', e => {
      setOpen(false);
      const tab = a.dataset.tab && document.querySelector('.tab[data-target="' + a.dataset.tab + '"]');
      if (tab) { 
        e.preventDefault(); 
        tab.click(); 
        document.querySelector('.tabs-header').scrollIntoView({ behavior: 'smooth' }); 
      }
    }));
  })();
  </script>
</body>
</html>
